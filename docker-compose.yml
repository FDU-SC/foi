# 开箱即用的 Docker Compose～
#
#   cp .env.example .env
#   docker compose up -d
#
# 默认监听 http://localhost:3000 。数据库自建，表结构在应用启动时迁移。
#
# 要改这里的任何一项，不要直接编辑本文件——写一份 docker-compose.override.yml

services:
  app:
    image: ${FOI_IMAGE:-ghcr.io/fdu-sc/foi:latest}
    # 想从源码构建而不是拉镜像，注释掉上面一行，改用这个：
    # build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foi}:${POSTGRES_PASSWORD:-foi_dev_password}@postgres:5432/${POSTGRES_DB:-foi}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${FOI_BIND:-0.0.0.0}:${FOI_PORT:-3000}:3000"
    networks:
      - internal

  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-foi}
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-foi} -d ${POSTGRES_DB:-foi} -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # 模拟评测机
  stub-runner:
    profiles: [demo]
    image: ${FOI_IMAGE:-ghcr.io/fdu-sc/foi:latest}
    restart: unless-stopped
    command: ["node", "scripts/stub-runner.cjs"]
    environment:
      FOI_STUB_RUNNER: yes-fake-verdicts
      FOI_KERNEL_URL: http://app:3000
      FOI_BACKEND_SECRET: ${FOI_BACKEND_SECRET:-}
      FOI_STUB_BACKENDS: ${FOI_STUB_BACKENDS:-traditional,interactive,performance}
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
