services:
  postgres:
    image: postgres:16-alpine
    container_name: foi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foi
      POSTGRES_PASSWORD: foi_dev_password
      POSTGRES_DB: foi
    ports:
      - "5433:5432"
    volumes:
      - foi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foi -d foi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A mailbox for development, in the same spirit as scripts/mock-backend.ts:
  # registration and password recovery both end in a link that arrives by
  # email, and neither is much use if reading it needs a real relay. Point
  # FOI_SMTP_HOST at localhost:1025 and read what was sent at
  # http://localhost:8025. Leave it unset and messages go to the console.
  mailpit:
    image: axllent/mailpit:latest
    container_name: foi-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  foi-pgdata:
