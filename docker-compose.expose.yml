# Host-port overlay, used by the dev and staging environments. Enabled by
# setting this in their .env:
#
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.expose.yml
#
# Neither is fronted by Caddy, so they publish a host port instead and are
# reached over the tailnet at http://<tailnet-host>:<FOI_PORT>.
#
# FOI_PORT is required rather than defaulted: dev and staging share a host, so
# a missing value would silently land both on the same port.

services:
  app:
    ports:
      - "${FOI_PORT:?FOI_PORT 未设置}:3000"
