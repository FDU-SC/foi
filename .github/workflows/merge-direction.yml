name: 合并方向

# nightly 每晚从 main 重放 demo 配置后强推；反向合并会带入演示配置，且会被下次重建覆盖。
# GitHub ruleset 只能按目标分支设条件，因此须将本工作流设为 main 的必需检查。
# 不设 paths-ignore，避免跳过检查后 PR 一直等待状态。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-direction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direction:
    name: 只许向下游合并
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 拒绝回流
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        # 变量一律写成 ${}，紧跟其后的中文标点会被当成变量名的一部分。
        run: |
          set -euo pipefail

          if [ "${HEAD_REF}" != "nightly" ]; then
            echo "${HEAD_REF} → ${BASE_REF}，方向没问题。"
            exit 0
          fi

          echo "::error::拒绝 nightly → ${BASE_REF}：演示配置分支不可合回上游，平台改动请对 main 提 PR。"
          exit 1
