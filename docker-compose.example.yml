services:
  app:
    image: ${FOI_IMAGE:?FOI_IMAGE is not set}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:3000"
    networks:
      - internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foi
      POSTGRES_PASSWORD: foi_dev_password
      POSTGRES_DB: foi
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foi -d foi -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  internal:

volumes:
  pgdata:
