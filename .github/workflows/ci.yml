name: CI

# 使用 GitHub 托管 runner（公开仓库免费），避免在自有机器执行不可信 PR 的依赖安装脚本。
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  # 按调用方区分并发组，避免每夜重建与 main 推送检查互相取消。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://foi:foi_ci_password@localhost:5432/foi

jobs:
  check:
    name: 检查
    # 仅在上游运行，避免与下游流水线重复。fork PR 的 github.repository 是接收仓库，仍会运行。
    if: github.repository == 'FDU-SC/foi'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: foi
          POSTGRES_PASSWORD: foi_ci_password
          POSTGRES_DB: foi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          # 这一步默认会为 packageManager 声明的包管理器配缓存，而 pnpm 要等下一步
          # corepack 才存在。开着它会直接报 "Unable to locate executable file: pnpm"。
          package-manager-cache: false

      - name: 启用 pnpm
        run: corepack enable

      - name: 准备环境
        run: |
          cp .env.example .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 应用迁移
        run: pnpm db:migrate

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 启动
        # 生产构建下 tier() 会判成 prod 并要求只在生产生效的那组配置。这一步只验证
        # 服务起得来，真实部署仍然会走那些检查。
        env:
          FOI_ENV: dev
        run: |
          pnpm start > "$RUNNER_TEMP/run.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:3000/api/health").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'; then
              cat "$RUNNER_TEMP/run.log"
              exit 0
            fi
            sleep 1
          done
          echo "服务在 30 秒内没有就绪，启动日志：" >&2
          cat "$RUNNER_TEMP/run.log" >&2
          exit 1

  content-free:
    name: 抽空 content
    if: github.repository == 'FDU-SC/foi'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: foi
          POSTGRES_PASSWORD: foi_ci_password
          POSTGRES_DB: foi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          # 这一步默认会为 packageManager 声明的包管理器配缓存，而 pnpm 要等下一步
          # corepack 才存在。开着它会直接报 "Unable to locate executable file: pnpm"。
          package-manager-cache: false

      - name: 启用 pnpm
        run: corepack enable

      - name: 准备环境
        run: |
          cp .env.example .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: content 根仅保留入口
        # scripts/strip-content.ts 从 lib/ 的 import 推导保留项，无需维护入口列表。
        run: node --import tsx scripts/strip-content.ts

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: 构建
        run: pnpm build

      - name: 启动
        env:
          FOI_ENV: dev
        run: |
          pnpm start > "$RUNNER_TEMP/run.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if node -e 'fetch("http://127.0.0.1:3000/api/health").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))'; then
              cat "$RUNNER_TEMP/run.log"
              exit 0
            fi
            sleep 1
          done
          echo "服务在 30 秒内没有就绪，启动日志：" >&2
          cat "$RUNNER_TEMP/run.log" >&2
          exit 1
